<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AIChat | Intelligent Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #020617;
            color: #f8fafc;
            overflow: hidden;
            /* Use dynamic viewport height for mobile browsers */
            height: 100dvh; 
        }

        /* Sidebar Responsive Transitions */
        .sidebar {
            background: rgba(15, 23, 42, 0.98);
            backdrop-filter: blur(16px);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), width 0.3s ease, opacity 0.3s ease;
            height: 100dvh;
        }

        /* Desktop specific collapse behavior */
        @media (min-width: 768px) {
            .sidebar.collapsed {
                width: 0;
                transform: translateX(-100%);
                opacity: 0;
                pointer-events: none;
            }
        }
        
        /* Mobile specific collapse behavior */
        @media (max-width: 767px) {
            .sidebar.collapsed {
                transform: translateX(-100%);
            }
        }

        .chat-area {
            background-color: transparent;
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .message-user-bubble {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.2);
        }

        .message-bot-bubble {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Markdown Styling - Scaled for mobile */
        .markdown-content p { margin-bottom: 0.75rem; }
        .markdown-content p:last-child { margin-bottom: 0; }
        .markdown-content code { 
            background: rgba(0, 0, 0, 0.3); 
            padding: 0.2rem 0.4rem; 
            border-radius: 0.25rem; 
            font-family: monospace;
            font-size: 0.85em;
        }
        .markdown-content pre {
            background: #0f172a;
            padding: 1rem;
            border-radius: 0.75rem;
            overflow-x: auto;
            margin: 0.75rem 0;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Animations */
        .typing-dot {
            width: 5px;
            height: 5px;
            background: #818cf8;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }
        @media (min-width: 768px) {
            .typing-dot { width: 6px; height: 6px; }
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        .glow {
            position: absolute;
            width: 50vw;
            height: 50vw;
            max-width: 500px;
            max-height: 500px;
            background: radial-gradient(circle, rgba(79, 70, 229, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            pointer-events: none;
            z-index: 0;
        }

        .voice-active {
            animation: pulse-red 1.5s infinite;
            color: #ef4444 !important;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        #chat-form {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.5);
            outline: none;
        }

        #chat-form:focus-within {
            border-color: rgba(79, 70, 229, 0.5);
            background: rgba(15, 23, 42, 0.9);
        }

        textarea:focus {
            outline: none !important;
            box-shadow: none !important;
        }

        .history-item {
            transition: all 0.2s ease;
        }
        .history-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .history-item.active {
            background: rgba(79, 70, 229, 0.15);
            border-left: 3px solid #6366f1;
        }

        /* Overlay for mobile sidebar */
        .sidebar-overlay {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            transition: opacity 0.3s ease;
        }
        
        /* Input area gradient map for seamless scrolling */
        .input-gradient-bg {
            background: linear-gradient(to top, #020617 60%, rgba(2, 6, 23, 0.8) 80%, transparent 100%);
        }
    </style>
</head>
<body class="flex w-full relative">
    
    <div class="glow top-[-10%] right-[-10%]"></div>
    <div class="glow bottom-[-10%] left-[-10%]"></div>

    <!-- Mobile Sidebar Overlay -->
    <div id="sidebar-overlay" onclick="toggleSidebar()" class="sidebar-overlay fixed inset-0 z-40 opacity-0 pointer-events-none md:hidden"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar w-72 flex flex-col shrink-0 z-50 fixed md:relative left-0 top-0 collapsed md:collapsed-none">
        <div class="p-5 md:p-6">
            <div class="flex items-center justify-between mb-8 mt-2 md:mt-0">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 md:w-10 md:h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/20">
                        <i class="fas fa-bolt text-sm md:text-base"></i>
                    </div>
                    <span class="font-bold text-lg md:text-xl tracking-tight text-indigo-400">AIChat</span>
                </div>
                <!-- Close button only visible on mobile -->
                <button onclick="toggleSidebar()" class="p-2 text-slate-400 hover:text-white transition-colors md:hidden">
                    <i class="fas fa-times text-lg"></i>
                </button>
                <!-- Collapse button for desktop -->
                <button onclick="toggleSidebar()" class="hidden md:block p-2 text-slate-500 hover:text-white transition-colors">
                    <i class="fas fa-outdent text-lg"></i>
                </button>
            </div>
            
            <button onclick="createNewChat()" class="w-full py-3 px-4 rounded-xl border border-dashed border-slate-600 hover:border-indigo-500/50 hover:bg-indigo-500/5 flex items-center justify-center gap-2 transition-all group">
                <i class="fas fa-plus text-xs text-slate-400 group-hover:text-indigo-400 transition-colors"></i>
                <span class="text-sm font-medium text-slate-300 group-hover:text-indigo-400 transition-colors">New Chat</span>
            </button>
        </div>

        <div id="history-container" class="flex-1 overflow-y-auto px-3 md:px-4 space-y-1 scrollbar-hide pb-4">
            <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest px-3 mb-2 mt-2">Recent Sessions</p>
            <div id="history-list" class="space-y-1">
                <!-- History items injected here -->
            </div>
        </div>

        <div class="p-4 md:p-6 mt-auto border-t border-white/5 bg-slate-900/50">
            <div class="flex items-center gap-3 p-3 rounded-2xl bg-white/5 border border-white/5 hover:bg-white/10 transition-colors cursor-pointer">
                <div class="w-9 h-9 md:w-10 md:h-10 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center text-xs font-bold ring-2 ring-white/10 shrink-0">JD</div>
                <div class="flex flex-col overflow-hidden">
                    <span class="text-sm font-bold truncate text-slate-200">User Account</span>
                    <span class="text-[10px] text-indigo-400 font-bold uppercase tracking-wider">Pro Member</span>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="flex-1 flex flex-col chat-area h-[100dvh] w-full relative z-10">
        
        <!-- Header -->
        <header class="absolute top-0 left-0 right-0 z-30 flex items-center p-3 md:p-6 h-16 md:h-20 bg-slate-950/80 backdrop-blur-md border-b border-white/5">
            <button id="open-sidebar-btn" onclick="toggleSidebar()" class="p-2 md:p-3 text-slate-400 hover:text-white transition-all mr-1 md:mr-2">
                <i class="fas fa-indent text-lg md:text-xl"></i>
            </button>
            <div class="flex items-center gap-2">
                <span class="text-sm md:text-base font-bold text-slate-300">AIChat 2.5</span>
                <span id="audio-status" class="hidden text-[9px] md:text-[10px] px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 font-bold border border-indigo-500/20 animate-pulse">SPEAKING</span>
            </div>
        </header>

        <!-- Scrollable Messages -->
        <div id="chat-viewport" class="flex-1 overflow-y-auto px-4 md:px-6 pt-20 pb-28 md:pb-36 scrollbar-hide w-full">
            <div id="chat-messages" class="max-w-3xl mx-auto space-y-6 md:space-y-8 w-full">
                
                <div id="welcome-screen" class="flex flex-col items-center justify-center min-h-[60vh] text-center space-y-4 md:space-y-6 animate-in fade-in duration-500">
                    <div class="w-16 h-16 md:w-20 md:h-20 rounded-2xl md:rounded-3xl bg-indigo-600/10 flex items-center justify-center mb-1 md:mb-2 border border-indigo-500/20 shadow-2xl shadow-indigo-500/10">
                        <i class="fas fa-microphone-alt text-2xl md:text-3xl text-indigo-500"></i>
                    </div>
                    <div class="space-y-2 px-4">
                        <h2 class="text-2xl md:text-3xl font-bold tracking-tight text-white">How can I help you today?</h2>
                        <p class="text-sm md:text-base text-slate-400 max-w-sm mx-auto">Tap the microphone to start a voice conversation or type below.</p>
                    </div>
                </div>

            </div>

            <!-- Typing Indicator (Appended dynamically to follow scroll) -->
            <div id="typing-indicator" class="hidden max-w-3xl mx-auto w-full mt-6 md:mt-8">
                <div class="flex gap-3 md:gap-5">
                    <div class="w-8 h-8 md:w-10 md:h-10 rounded-xl md:rounded-2xl bg-indigo-600 flex items-center justify-center shrink-0 shadow-lg mt-1">
                        <i class="fas fa-robot text-white text-[10px] md:text-sm"></i>
                    </div>
                    <div class="flex gap-1.5 items-center bg-slate-800/40 backdrop-blur-md px-4 py-3 md:px-5 md:py-4 rounded-2xl rounded-tl-none border border-white/5">
                        <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Input Area Footer -->
        <div class="absolute bottom-0 left-0 right-0 w-full px-3 md:px-6 pb-4 md:pb-8 pt-6 input-gradient-bg z-30 pointer-events-none">
            <div class="max-w-4xl mx-auto w-full pointer-events-auto">
                <form id="chat-form" class="relative backdrop-blur-xl rounded-2xl md:rounded-[28px] transition-all px-2 md:px-4 py-1.5 md:py-2 flex items-end">
                    
                    <button type="button" id="voice-btn" class="p-2.5 md:p-3 text-slate-400 hover:text-indigo-400 transition-colors rounded-full mb-0.5 md:mb-1 shrink-0">
                        <i class="fas fa-microphone text-base md:text-lg"></i>
                    </button>
                    
                    <textarea 
                        id="user-input"
                        rows="1"
                        placeholder="Message AIChat..."
                        class="flex-1 bg-transparent border-none focus:ring-0 py-3 md:py-4 px-2 text-sm md:text-base resize-none max-h-32 md:max-h-48 scrollbar-hide placeholder-slate-500 text-white"
                    ></textarea>
                    
                    <button 
                        type="submit"
                        id="send-btn"
                        class="p-2 md:p-3 bg-indigo-600 text-white rounded-xl md:rounded-2xl w-10 h-10 md:w-12 md:h-12 flex items-center justify-center mb-1 md:mb-1.5 disabled:opacity-30 disabled:cursor-not-allowed transition-all shadow-lg shadow-indigo-500/20 shrink-0 mx-1"
                        disabled
                    >
                        <i class="fas fa-arrow-up text-sm md:text-base"></i>
                    </button>
                </form>
                <div class="text-center mt-2 md:mt-3">
                    <p class="text-[10px] md:text-xs text-slate-500">AI can make mistakes. Verify critical information.</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const chatMessages = document.getElementById('chat-messages');
        const typingIndicator = document.getElementById('typing-indicator');
        const historyList = document.getElementById('history-list');
        const sendBtn = document.getElementById('send-btn');
        const voiceBtn = document.getElementById('voice-btn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        const openSidebarBtn = document.getElementById('open-sidebar-btn');
        const audioStatus = document.getElementById('audio-status');
        const chatViewport = document.getElementById('chat-viewport');

        const apiKey = ""; // Set API key if using Gemini TTS/STT APIs
        let currentChatId = null;
        let chats = JSON.parse(localStorage.getItem('aichat_history') || '[]');

        // Initialize marked options for formatting text
        marked.setOptions({ breaks: true, gfm: true });

        // --- Voice Recognition Setup ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';
            recognition.onstart = () => voiceBtn.classList.add('voice-active');
            recognition.onend = () => voiceBtn.classList.remove('voice-active');
            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                userInput.value = transcript;
                userInput.dispatchEvent(new Event('input'));
                handleChatSubmit();
            };
        } else {
            // Hide voice button if unsupported
            voiceBtn.style.display = 'none';
        }

        voiceBtn.onclick = () => recognition && recognition.start();

        // --- TTS Helper Function ---
        async function speakText(text) {
            if (!apiKey) return; // Skip if no API key
            try {
                audioStatus.classList.remove('hidden');
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Say naturally: ${text.substring(0, 500)}` }] }],
                        generationConfig: { 
                            responseModalities: ["AUDIO"],
                            speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Kore" } } }
                        }
                    })
                });
                // Audio processing code would go here
                setTimeout(() => audioStatus.classList.add('hidden'), 2000);
            } catch (err) {
                audioStatus.classList.add('hidden');
            }
        }

        // --- Responsive Sidebar Logic ---
        function toggleSidebar() {
            const isMobile = window.innerWidth < 768;
            sidebar.classList.toggle('collapsed');
            
            if (isMobile) {
                // Toggle mobile overlay
                if (sidebar.classList.contains('collapsed')) {
                    overlay.classList.add('opacity-0', 'pointer-events-none');
                    overlay.classList.remove('opacity-100', 'pointer-events-auto');
                } else {
                    overlay.classList.remove('opacity-0', 'pointer-events-none');
                    overlay.classList.add('opacity-100', 'pointer-events-auto');
                }
            }
            
            updateOpenSidebarBtnVisibility();
        }

        function updateOpenSidebarBtnVisibility() {
            const isMobile = window.innerWidth < 768;
            if (sidebar.classList.contains('collapsed')) {
                openSidebarBtn.style.opacity = '1';
                openSidebarBtn.style.pointerEvents = 'auto';
                openSidebarBtn.style.transform = 'scale(1)';
            } else {
                if (!isMobile) {
                    openSidebarBtn.style.opacity = '0';
                    openSidebarBtn.style.pointerEvents = 'none';
                    openSidebarBtn.style.transform = 'scale(0.8)';
                } else {
                    openSidebarBtn.style.opacity = '1';
                }
            }
        }

        // Handle window resizing to ensure overlay drops on desktop
        window.addEventListener('resize', () => {
            if (window.innerWidth >= 768) {
                overlay.classList.add('opacity-0', 'pointer-events-none');
                overlay.classList.remove('opacity-100', 'pointer-events-auto');
            } else if (!sidebar.classList.contains('collapsed')) {
                overlay.classList.remove('opacity-0', 'pointer-events-none');
                overlay.classList.add('opacity-100', 'pointer-events-auto');
            }
            updateOpenSidebarBtnVisibility();
        });

        function saveToLocal() {
            localStorage.setItem('aichat_history', JSON.stringify(chats));
            renderHistoryList();
        }

        function createNewChat() {
            currentChatId = Date.now().toString();
            chatMessages.innerHTML = `
                <div id="welcome-screen" class="flex flex-col items-center justify-center min-h-[60vh] text-center space-y-4 md:space-y-6 animate-in fade-in duration-500">
                    <div class="w-16 h-16 md:w-20 md:h-20 rounded-2xl md:rounded-3xl bg-indigo-600/10 flex items-center justify-center mb-1 md:mb-2 border border-indigo-500/20 shadow-2xl shadow-indigo-500/10">
                        <i class="fas fa-microphone-alt text-2xl md:text-3xl text-indigo-500"></i>
                    </div>
                    <div class="space-y-2 px-4">
                        <h2 class="text-2xl md:text-3xl font-bold tracking-tight text-white">How can I help you today?</h2>
                        <p class="text-sm md:text-base text-slate-400 max-w-sm mx-auto">New session started. Type below.</p>
                    </div>
                </div>
            `;
            
            if (window.innerWidth < 768) {
                toggleSidebar(); // Close sidebar on mobile after new chat
            }
            renderHistoryList();
        }

        function loadChat(id) {
            const chat = chats.find(c => c.id === id);
            if (!chat) return;
            currentChatId = id;
            chatMessages.innerHTML = '';
            chat.messages.forEach(msg => appendToUI(msg.text, msg.sender, false)); // Don't auto-scroll on load
            renderHistoryList();
            
            if (window.innerWidth < 768) {
                toggleSidebar(); // Close sidebar on mobile after selecting
            }
            
            setTimeout(() => {
                chatViewport.scrollTop = chatViewport.scrollHeight;
            }, 50);
        }

        function renderHistoryList() {
            historyList.innerHTML = '';
            chats.slice().reverse().forEach(chat => {
                const item = document.createElement('div');
                item.className = `history-item flex items-center gap-3 p-3 rounded-xl cursor-pointer text-sm font-medium text-slate-400 ${currentChatId === chat.id ? 'active text-indigo-400' : ''}`;
                item.onclick = () => loadChat(chat.id);
                item.innerHTML = `
                    <i class="fas fa-comment-alt text-xs opacity-50"></i>
                    <span class="truncate flex-1">${chat.title}</span>
                    <button onclick="event.stopPropagation(); deleteChat('${chat.id}')" class="opacity-0 group-hover:opacity-100 p-1 hover:text-red-400 transition-opacity">
                        <i class="fas fa-times"></i>
                    </button>
                `;
                item.classList.add('group');
                historyList.appendChild(item);
            });
        }

        function deleteChat(id) {
            chats = chats.filter(c => c.id !== id);
            if (currentChatId === id) createNewChat();
            saveToLocal();
        }

        // --- Input Field Handling ---
        userInput.addEventListener('input', () => {
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, window.innerWidth < 768 ? 120 : 192) + 'px'; // Max heights
            sendBtn.disabled = !userInput.value.trim();
        });

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleChatSubmit();
            }
        });

        function appendToUI(text, sender, smoothScroll = true) {
            const welcome = document.getElementById('welcome-screen');
            if (welcome) welcome.remove();
            
            const isUser = sender === 'user';
            const messageDiv = document.createElement('div');
            // Improved margin & padding logic for responsiveness
            messageDiv.className = `flex gap-3 md:gap-5 group animate-in slide-in-from-bottom-2 duration-300 w-full ${isUser ? 'justify-end' : ''}`;
            
            messageDiv.innerHTML = `
                ${!isUser ? `<div class="w-8 h-8 md:w-10 md:h-10 rounded-xl md:rounded-2xl bg-indigo-600 flex items-center justify-center shrink-0 shadow-lg mt-1"><i class="fas fa-robot text-white text-[10px] md:text-sm"></i></div>` : ''}
                <div class="flex flex-col gap-1.5 md:gap-2 max-w-[85%] md:max-w-[80%] ${isUser ? 'items-end' : ''}">
                    <div class="${isUser ? 'message-user-bubble text-white px-4 py-3 md:px-6 md:py-4 rounded-2xl md:rounded-[26px] rounded-tr-sm md:rounded-tr-none' : 'message-bot-bubble px-4 py-3 md:px-6 md:py-4 rounded-2xl md:rounded-[26px] rounded-tl-sm md:rounded-tl-none text-slate-200'} text-sm md:text-base leading-relaxed markdown-content shadow-sm w-full">
                        ${isUser ? text.replace(/\n/g, '<br>') : marked.parse(text)}
                    </div>
                </div>
            `;
            chatMessages.appendChild(messageDiv);
            
            if (smoothScroll) {
                chatViewport.scrollTo({
                    top: chatViewport.scrollHeight,
                    behavior: 'smooth'
                });
            }
        }

        async function handleChatSubmit() {
            const message = userInput.value.trim();
            if (!message) return;
            
            // Auto-collapse sidebar on mobile when starting a chat
            if (window.innerWidth < 768 && !sidebar.classList.contains('collapsed')) {
                toggleSidebar();
            }

            userInput.value = '';
            userInput.style.height = 'auto';
            sendBtn.disabled = true;

            if (!currentChatId) currentChatId = Date.now().toString();

            // Store message locally
            let activeChat = chats.find(c => c.id === currentChatId);
            if (!activeChat) {
                activeChat = { id: currentChatId, title: message.substring(0, 30) + '...', messages: [] };
                chats.push(activeChat);
            }
            activeChat.messages.push({ sender: 'user', text: message });
            
            appendToUI(message, 'user');
            
            // Append and show typing indicator
            chatViewport.appendChild(typingIndicator);
            typingIndicator.classList.remove('hidden');
            typingIndicator.classList.add('flex');
            
            chatViewport.scrollTo({
                top: chatViewport.scrollHeight,
                behavior: 'smooth'
            });

            try {
                // Modified to add a simulated response if fetch fails
                let replyText = "";
                
                try {
                    const response = await fetch('/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message })
                    });
                    if(response.ok) {
                        const data = await response.json();
                        replyText = data.reply;
                    } else {
                        throw new Error('Backend not available');
                    }
                } catch(e) {
                    // Fallback Demo Response for Responsive Preview
                    console.log("Using fallback response because backend /chat is unavailable.");
                    await new Promise(resolve => setTimeout(resolve, 1200)); // Simulate thinking
                    replyText = `That's an interesting question! Since this is a **responsive design preview**, here is a simulated response.\n\nYour message was: *"${message}"*\n\nNotice how the layout adjusts cleanly on mobile, and the input field pushes the content up naturally. Try opening the sidebar!`;
                }
                
                activeChat.messages.push({ sender: 'bot', text: replyText });
                saveToLocal();
                
                appendToUI(replyText, 'bot');
                speakText(replyText);
            } catch (err) {
                appendToUI("Backend connection lost. Please try again.", 'bot');
            } finally {
                typingIndicator.classList.add('hidden');
                typingIndicator.classList.remove('flex');
            }
        }

        // Initialize state
        if (window.innerWidth < 768) {
            sidebar.classList.add('collapsed');
            overlay.classList.add('opacity-0', 'pointer-events-none');
        } else {
            // Keep desktop open by default
            sidebar.classList.remove('collapsed');
        }
        
        updateOpenSidebarBtnVisibility();
        renderHistoryList();
    </script>
</body>
</html>
